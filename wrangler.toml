name = "bgv-admin"
main = "src/worker.ts"
compatibility_date = "2025-10-01"

[vars]
APP_NAME = "BG Venture Properties Admin"
PUBLIC_SITE = "https://bg-venture-properties.pages.dev"

[assets]
directory = "./admin"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bgv-admin"
database_id = "f3f7bb78-d330-4057-ac0a-c93c38113296"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "bgv-admin-media"      # run: npx wrangler r2 bucket create bgv-admin-media

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bgv-admin-media"
